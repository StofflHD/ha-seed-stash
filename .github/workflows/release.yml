name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build release zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' custom_components/seed_stash/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/seed_stash/manifest.json

      - name: Zip integration
        run: |
          cd custom_components/seed_stash
          zip -r "$GITHUB_WORKSPACE/seed_stash.zip" . -x "__pycache__/*"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" seed_stash.zip --clobber
